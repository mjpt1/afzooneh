<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="برداشت‌گر فروشگاه پرو">
  <defs>
    <linearGradient id="shpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#shpGrad)"/>

  <!-- shopping bag body -->
  <path d="M60 90h136l-11 106.4A26 26 0 0 1 159.1 220H96.9A26 26 0 0 1 71 196.4z"
        fill="#ffffff"/>

  <!-- bag handles -->
  <path d="M92 94V76a36 36 0 0 1 72 0v18"
        fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>

  <!-- harvest arrow: products flowing down into the bag -->
  <path d="M128 106v46M106 134l22 22 22-22"
        fill="none" stroke="#6366f1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- comparison bars: the price-compare motif -->
  <g fill="#8b5cf6">
    <rect x="102" y="186" width="11" height="14" rx="3.5"/>
    <rect x="122.5" y="178" width="11" height="22" rx="3.5"/>
    <rect x="143" y="170" width="11" height="30" rx="3.5"/>
  </g>
</svg>
