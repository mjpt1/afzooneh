<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" role="img" aria-label="ShopHarvester Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <circle cx="1240" cy="250" r="360" fill="url(#glow)"/>

  <!-- comparison bars motif, faint -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="90"  y="330" width="34" height="90"  rx="10"/>
    <rect x="150" y="290" width="34" height="130" rx="10"/>
    <rect x="210" y="240" width="34" height="180" rx="10"/>
    <rect x="270" y="300" width="34" height="120" rx="10"/>
  </g>

  <!-- glyph -->
  <g transform="translate(120 122) scale(1.0)">
    <rect width="256" height="256" rx="58" fill="url(#grad)"/>
    <path d="M60 90h136l-11 106.4A26 26 0 0 1 159.1 220H96.9A26 26 0 0 1 71 196.4z" fill="#0f172a"/>
    <path d="M92 94V76a36 36 0 0 1 72 0v18" fill="none" stroke="#0f172a" stroke-width="15" stroke-linecap="round"/>
    <path d="M128 106v46M106 134l22 22 22-22" fill="none" stroke="#a78bfa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#c4b5fd">
      <rect x="102" y="186" width="11" height="14" rx="3.5"/>
      <rect x="122.5" y="178" width="11" height="22" rx="3.5"/>
      <rect x="143" y="170" width="11" height="30" rx="3.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="430" y="238" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-1">ShopHarvester</text>
    <g transform="translate(430 268)">
      <rect width="150" height="70" rx="16" fill="url(#grad)"/>
      <text x="75" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">PRO</text>
    </g>
    <text x="1470" y="380" text-anchor="end" font-size="38" font-weight="600" fill="#c7d2fe">برداشت خودکار محصولات و مقایسه‌ی قیمت میان فروشگاه‌ها</text>
  </g>
</svg>
